[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "research-intelligence-platform"
version = "1.0.0"
description = "Local-first research intelligence platform: turns external research into ranked, backtest-ready crypto trading strategy hypotheses (non-HFT)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Boris Zabavnikov" }]
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "typer>=0.12",
    "sqlalchemy>=2.0",
    "httpx>=0.27",
    "pypdf>=4.2",
    "python-dotenv>=1.0",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]
backtest = [
    "pandas>=2.0",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
]
parquet = [
    "pandas>=2.0",
    "pyarrow>=15.0",
]

[project.scripts]
research-intel = "research_intel.cli:app"

[project.urls]
Homepage = "https://github.com/zabor-crypto/research-intelligence-platform"
Repository = "https://github.com/zabor-crypto/research-intelligence-platform"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
